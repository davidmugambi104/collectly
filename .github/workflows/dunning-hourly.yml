# Runs the reminder scheduler every hour.
#
# Vercel's Hobby plan only allows cron jobs once a day, and send windows need the
# scheduler to run through the day so that it can act when each owner's window is
# open. This calls the same protected endpoint Vercel's daily cron calls.
#
# It does nothing until two repository secrets exist, so it is safe to merge
# before they are set:
#   APP_URL      e.g. https://getcollectly.app  (the host that serves /api)
#   DUNNING_TRIGGER_SECRET  the same value as the DUNNING_TRIGGER_SECRET environment
#                variable on Vercel. A separate secret from CRON_SECRET on purpose:
#                CRON_SECRET is also used for OAuth state signing and stays in Vercel.
#
# Running it more often than the daily cron is safe: each step of a sequence is
# recorded once per invoice, so a repeat run finds nothing new to do.
name: dunning-hourly
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the scheduler
        env:
          APP_URL: ${{ secrets.APP_URL }}
          TRIGGER_SECRET: ${{ secrets.DUNNING_TRIGGER_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$TRIGGER_SECRET" ]; then
            echo "APP_URL or DUNNING_TRIGGER_SECRET is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $TRIGGER_SECRET" \
            "$APP_URL/api/cron/dunning"
