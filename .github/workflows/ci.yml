name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Lint + typecheck — fast feedback, no DB needed
  check:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx next lint --quiet || true   # warn-only for now; tighten later

  # 2. Build — full Next.js production build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Leave Clerk keys empty in CI — the ClerkProvider falls back to no-provider
      # mode (mirroring the dev shim) and the build completes. Real keys are
      # injected at runtime via Vercel env vars.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
      CLERK_SECRET_KEY: ""
      STRIPE_SECRET_KEY: sk_test_ci_stripe
      OPENAI_API_KEY: sk-test-ci-openai
      RESEND_API_KEY: re_test_ci
      TWILIO_ACCOUNT_SID: ACtest_ci
      TWILIO_AUTH_TOKEN: test_ci
      TWILIO_PHONE_NUMBER: '+15555550100'
      QUICKBOOKS_CLIENT_ID: test_ci
      QUICKBOOKS_CLIENT_SECRET: test_ci
      XERO_CLIENT_ID: test_ci
      XERO_CLIENT_SECRET: test_ci
      STRIPE_WEBHOOK_SECRET: whsec_test_ci
      POSTHOG_API_KEY: phc_test_ci
      POSTHOG_HOST: https://us.i.posthog.com
      USE_DEV_AUTH: 1
      USE_PGLITE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx next build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 3

  # 3. Drizzle schema validation — uses real Postgres
  db:
    name: DB schema check
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collectly
          POSTGRES_PASSWORD: collectly
          POSTGRES_DB: collectly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U collectly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://collectly:collectly@localhost:5432/collectly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Push schema
        run: npx drizzle-kit push --config=drizzle.config.ts
      - name: Smoke test
        run: |
          node -e "
            const { Client } = require('pg');
            const c = new Client({ connectionString: process.env.DATABASE_URL });
            c.connect().then(() => c.query('select count(*) from organizations')).then(r => { console.log('OK — orgs:', r.rows[0].count); c.end(); }).catch(e => { console.error('FAIL:', e.message); process.exit(1); });
          "

  # 4. Secret scan — catch any leaked tokens before they go to main
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
